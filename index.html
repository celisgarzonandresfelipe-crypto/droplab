<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Comandas Fácil</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#17202a;font-family:Arial,sans-serif}header{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:9}h1{margin:0;font-size:22px}.sub{opacity:.75;font-size:12px;margin-top:3px}
main{max-width:760px;margin:auto;padding:12px 12px 90px}.panel{background:#fff;border-radius:16px;padding:13px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{border:0;border-radius:12px;padding:13px 9px;font-size:15px;font-weight:700;background:#fff;box-shadow:0 2px 7px #0001}.mesa{background:#2563eb;color:#fff;min-height:66px}.mesa small{display:block;font-size:11px;margin-top:3px}
h2{font-size:17px;margin:0 0 10px}.cats{display:flex;gap:7px;overflow:auto;padding-bottom:7px}.cat{white-space:nowrap;background:#e5e7eb}.active{background:#111827;color:#fff!important}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.product{text-align:left;min-height:65px}.price{display:block;color:#6b7280;font-size:12px;margin-top:4px}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:9px 0}.qty{display:flex;gap:6px;align-items:center}.qty button{padding:7px 11px;background:#e5e7eb}.total{text-align:right;font-size:21px;font-weight:800;margin-top:10px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:15px;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.send{background:#16a34a;color:#fff}.danger{background:#ef4444;color:#fff}.install{background:#f59e0b;color:#111827;width:100%;margin-top:9px}
.empty{text-align:center;color:#777;padding:18px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:20}
dialog{border:0;border-radius:18px;width:min(94%,520px);padding:18px;box-shadow:0 8px 40px #0005}dialog::backdrop{background:#0007}.formrow{display:grid;grid-template-columns:1fr 120px;gap:8px}.manage{background:#7c3aed;color:#fff;width:100%}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.products{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><h1>🍽️ Comandas Fácil</h1><div class="sub">Tu menú · tus precios · tus mesas</div></header>
<main>
<button class="manage" onclick="openManage()">⚙️ Gestionar mis productos</button>
<button id="install" class="install" style="display:none" onclick="installApp()">📱 Instalar en mi Pixel</button>
<section class="panel"><h2>1️⃣ Elige la mesa</h2><div class="grid" id="tables"></div></section>
<section class="panel" id="menuPanel" style="display:none"><h2 id="mesaTitle"></h2><div class="cats" id="cats"></div><div class="products" id="products"></div></section>
<section class="panel" id="cartPanel" style="display:none"><h2>🧾 Comanda <span id="status"></span></h2><div id="cart"></div><div class="total">Total: <span id="total">0,00 €</span></div><input id="note" placeholder="📝 Nota: sin cebolla, poco hecho..."><div class="actions"><button class="send" onclick="sendOrder()">🟢 Enviar a cocina</button><button onclick="pay()">💶 Cuenta</button><button class="danger" onclick="clearOrder()">🗑️ Vaciar</button></div></section>
</main><div id="toast" class="toast"></div>
<dialog id="dlg"><h2>⚙️ Mis productos</h2><p>Añade los productos y precios de tu restaurante. Se guardan en este teléfono.</p><div id="productForm"></div><button class="manage" onclick="addProductRow()">➕ Añadir producto</button><button onclick="saveProducts()" style="width:100%;margin-top:8px">💾 Guardar</button><button onclick="dlg.close()" style="width:100%;margin-top:8px">Cerrar</button></dialog>
<script>
let menu=JSON.parse(localStorage.getItem('menuFacil')||'null')||{"Bebidas":[["Agua",1.5],["Coca-Cola",2.2]],"Platos":[["Hamburguesa",10],["Pizza",11]],"Postres":[["Tarta",5]],"Cafés":[["Café",1.8]]};
let orders=JSON.parse(localStorage.getItem('ordersFacil')||'null')||{};
for(let i=1;i<=12;i++)orders[i] ||= {items:[],note:"",status:"Pendiente"};
let selected=1,cat=Object.keys(menu)[0]||"Bebidas",deferred=null;
const $=id=>document.getElementById(id);
for(let i=1;i<=12;i++){let b=document.createElement('button');b.className='mesa';b.id='t'+i;b.innerHTML=`Mesa ${i}<small>0 productos</small>`;b.onclick=()=>selectTable(i);$('tables').appendChild(b)}
function save(){localStorage.setItem('menuFacil',JSON.stringify(menu));localStorage.setItem('ordersFacil',JSON.stringify(orders))}
function selectTable(n){selected=n;$('menuPanel').style.display='block';$('cartPanel').style.display='block';$('mesaTitle').textContent='2️⃣ Mesa '+n;cat=Object.keys(menu)[0]||'';render();scrollTo({top:$('menuPanel').offsetTop-60,behavior:'smooth'})}
function render(){renderCats();renderProducts();renderCart()}
function renderCats(){let c=$('cats');c.innerHTML='';Object.keys(menu).forEach(x=>{let b=document.createElement('button');b.className='cat '+(x==cat?'active':'');b.textContent=x;b.onclick=()=>{cat=x;render()};c.appendChild(b)})}
function renderProducts(){let p=$('products');p.innerHTML='';(menu[cat]||[]).forEach(([name,price])=>{let b=document.createElement('button');b.className='product';b.innerHTML=`${name}<span class="price">${Number(price).toFixed(2).replace('.',',')} €</span>`;b.onclick=()=>add(name,Number(price));p.appendChild(b)})}
function add(name,price){let a=orders[selected].items.find(x=>x.name==name);a?a.qty++:orders[selected].items.push({name,price,qty:1});save();renderCart();updateTable();toast('Añadido: '+name)}
function change(i,d){orders[selected].items[i].qty+=d;if(orders[selected].items[i].qty<=0)orders[selected].items.splice(i,1);save();renderCart();updateTable()}
function renderCart(){let o=orders[selected],c=$('cart');c.innerHTML='';$('status').textContent=o.status;if(!$('note').matches(':focus'))$('note').value=o.note||'';if(!o.items.length)c.innerHTML='<div class="empty">Aún no hay productos.</div>';else o.items.forEach((x,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div><b>${x.name}</b><br><small>${(x.price*x.qty).toFixed(2).replace('.',',')} €</small></div><div class="qty"><button onclick="change(${i},-1)">−</button><b>${x.qty}</b><button onclick="change(${i},1)">+</button></div>`;c.appendChild(d)});let t=o.items.reduce((s,x)=>s+x.price*x.qty,0);$('total').textContent=t.toFixed(2).replace('.',',')+' €'}
function updateTable(){let n=orders[selected].items.reduce((s,x)=>s+x.qty,0);$('t'+selected).querySelector('small').textContent=n+' producto'+(n==1?'':'s')}
function sendOrder(){orders[selected].note=$('note').value;orders[selected].status='En cocina';save();renderCart();toast('✅ Comanda enviada')}
function pay(){let t=orders[selected].items.reduce((s,x)=>s+x.price*x.qty,0);if(!t)return toast('No hay productos');alert('Mesa '+selected+'\\nTotal: '+t.toFixed(2).replace('.',',')+' €');orders[selected].status='Pagada';save();renderCart()}
function clearOrder(){if(confirm('¿Vaciar mesa '+selected+'?')){orders[selected]={items:[],note:'',status:'Pendiente'};save();renderCart();updateTable()}}
function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)}
function openManage(){let f=$('productForm');f.innerHTML='';Object.entries(menu).forEach(([cat,arr])=>arr.forEach(p=>addProductRow(cat,p[0],p[1])));if(!Object.keys(menu).length)addProductRow();dlg.showModal()}
function addProductRow(c='',n='',p=''){let d=document.createElement('div');d.className='formrow';d.innerHTML=`<input placeholder="Categoría" value="${c}"><input type="number" step="0.01" placeholder="Precio" value="${p}"><input style="grid-column:1/3" placeholder="Producto" value="${n}"><button style="grid-column:1/3" onclick="this.parentElement.remove()">🗑️ Quitar</button>`;$('productForm').appendChild(d)}
function saveProducts(){let rows=[...$('productForm').children],m={};rows.forEach(r=>{let q=r.querySelectorAll('input'),c=q[0].value.trim(),p=q[1].value,n=q[2].value.trim();if(c&&n&&p)m[c]??=[],m[c].push([n,Number(p)])});if(!Object.keys(m).length)return toast('Añade al menos un producto');menu=m;cat=Object.keys(menu)[0];save();dlg.close();render();toast('💾 Productos guardados')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='block'});
async function installApp(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').style.display='none'}else alert('En Chrome: toca ⋮ y elige “Instalar app” o “Añadir a pantalla de inicio”.')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
selectTable(1);for(let i=1;i<=12;i++)updateTable();
</script></body></html>
